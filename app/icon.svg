<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f9dff"/>
      <stop offset="0.5" stop-color="#54c6ee"/>
      <stop offset="1" stop-color="#79e6c9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0a4a63" flood-opacity="0.3"/>
    </filter>
    <filter id="ib" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="b"/>
      <feOffset in="b" dx="0" dy="4" result="o"/>
      <feComposite in="SourceGraphic" in2="o" operator="over"/>
    </filter>
    <g id="H">
      <rect x="150" y="138" width="66" height="236" rx="24"/>
      <rect x="296" y="138" width="66" height="236" rx="24"/>
      <rect x="200" y="224" width="112" height="64" rx="20"/>
    </g>
    <clipPath id="clipH"><use href="#H"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#sheen)"/>

  <!-- translucent glass H: the gradient shows through -->
  <use href="#H" fill="url(#glass)" filter="url(#ds)"/>
  <!-- specular streak inside the glass -->
  <g clip-path="url(#clipH)">
    <rect x="120" y="120" width="120" height="320" fill="#ffffff" opacity="0.28" transform="rotate(18 256 256)"/>
  </g>
  <use href="#H" fill="url(#bevel)"/>
  <use href="#H" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
