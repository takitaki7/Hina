<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4aa8ff"/>
      <stop offset="0.55" stop-color="#5cc8ee"/>
      <stop offset="1" stop-color="#74e2da"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.82"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#0a4a63" flood-opacity="0.28"/>
    </filter>
    <g id="H">
      <rect x="150" y="138" width="66" height="236" rx="22"/>
      <rect x="296" y="138" width="66" height="236" rx="22"/>
      <rect x="200" y="224" width="112" height="64" rx="18"/>
    </g>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect width="512" height="512" rx="120" fill="url(#sheen)"/>
  <use href="#H" fill="url(#glass)" filter="url(#ds)"/>
  <use href="#H" fill="url(#bevel)"/>
  <use href="#H" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
</svg>
