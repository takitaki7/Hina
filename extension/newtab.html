<!DOCTYPE html>
<html lang="en" data-tone="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hina — a calm new tab</title>
  <link rel="icon" href="icons/icon32.png" />
  <link rel="stylesheet" href="newtab.css" />
</head>
<body>
  <!-- Liquid-glass refraction filter (progressive enhancement) -->
  <svg class="svg-defs" aria-hidden="true" width="0" height="0">
    <defs>
      <filter id="liquid" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.014" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="1.4" result="soft" />
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="26" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- gentle lens used on glass backdrops in browsers that support it -->
      <filter id="glassLens" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.010" numOctaves="2" seed="14" result="n" />
        <feGaussianBlur in="n" stdDeviation="2" result="b" />
        <feDisplacementMap in="SourceGraphic" in2="b" scale="12" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <!-- film grain -->
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" /></filter>
    </defs>
  </svg>

  <!-- Background stack -->
  <div id="bg" class="bg"></div>
  <div class="blobs" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>
  <div class="caustics" aria-hidden="true"></div>
  <svg class="grain" aria-hidden="true"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <header class="topbar">
      <div class="date glass glass-pill"><span id="date"></span></div>
      <div class="topbar-actions">
      <button class="icon-btn glass glass-round" id="openSettings" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      </div>
    </header>

    <section class="hero">
      <div class="clock" id="clock">00:00</div>
      <div class="greeting" id="greeting"></div>

      <div class="focus" id="focusWrap">
        <svg class="focus-pen" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        <input class="focus-input" id="focusInput" type="text" autocomplete="off" spellcheck="false" />
      </div>
    </section>

    <section class="search-wrap">
      <form id="searchForm" class="search glass glass-pill" autocomplete="off">
        <span class="engine-badge" id="engineBadge"></span>
        <input id="searchInput" type="text" spellcheck="false" />
        <button type="submit" class="search-go" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </form>
    </section>

    <section class="dial" id="dial"></section>

    <footer class="bottombar">
      <div class="bottom-left">
        <button class="pill glass glass-pill" id="todoBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span id="todoCount"></span>
        </button>
        <button class="pill glass glass-pill" id="notesBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12l-5 5H4z"/><path d="M14 21v-5h5"/><path d="M8 9h8M8 13h5"/></svg>
          <span id="notesLabel"></span>
        </button>
      </div>
      <button class="pill glass glass-pill" id="pomoBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/></svg>
        <span id="pomoLabel"></span>
      </button>
    </footer>
  </main>

  <!-- To-do panel -->
  <aside class="panel glass" id="todoPanel" hidden>
    <div class="panel-head">
      <h2 id="todoTitle"></h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <form id="todoForm" class="todo-add">
      <input id="todoInput" type="text" autocomplete="off" />
      <button type="submit" class="glass glass-round">+</button>
    </form>
    <ul class="todo-list" id="todoList"></ul>
    <div class="panel-empty" id="todoEmpty"></div>
  </aside>

  <!-- Pomodoro panel -->
  <aside class="panel panel-center glass" id="pomoPanel" hidden>
    <div class="panel-head">
      <h2 id="pomoTitle"></h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <div class="pomo-ring">
      <svg viewBox="0 0 120 120" class="ring">
        <circle class="ring-track" cx="60" cy="60" r="52" />
        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52" />
      </svg>
      <div class="pomo-center">
        <div class="pomo-phase" id="pomoPhase"></div>
        <div class="pomo-time" id="pomoTime">25:00</div>
      </div>
    </div>
    <div class="pomo-dots" id="pomoDots"></div>
    <div class="segmented" id="pomoModes">
      <button type="button" data-min="25" class="seg active"></button>
      <button type="button" data-min="5" class="seg"></button>
      <button type="button" data-min="15" class="seg"></button>
    </div>
    <div class="pomo-controls">
      <button class="btn primary" id="pomoStart"></button>
      <button class="btn subtle" id="pomoReset"></button>
    </div>
    <button class="pomo-sound" id="pomoMute" aria-label="Sound"></button>
  </aside>

  <!-- Notes panel -->
  <aside class="panel glass" id="notesPanel" hidden>
    <div class="panel-head">
      <h2 id="notesTitle"></h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <textarea id="notesArea" class="notes-area" spellcheck="false"></textarea>
    <div class="notes-saved" id="notesSaved"></div>
  </aside>

  <!-- Settings panel -->
  <aside class="panel panel-wide glass" id="settingsPanel" hidden>
    <div class="panel-head">
      <h2 id="setTitle"></h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>

    <label class="field">
      <span id="setNameLabel"></span>
      <input id="setName" type="text" autocomplete="off" />
    </label>

    <label class="field">
      <span id="setEngineLabel"></span>
      <select id="setEngine">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="ecosia">Ecosia</option>
        <option value="brave">Brave</option>
      </select>
    </label>

    <label class="field">
      <span id="setLangLabel"></span>
      <select id="setLang">
        <option value="auto">Auto</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="es">Español</option>
      </select>
    </label>

    <div class="field">
      <span id="setThemeLabel"></span>
      <div class="palette" id="palette"></div>
      <div class="custom-row" id="customRow" hidden>
        <label class="cc"><span id="ccTopLabel"></span><input type="color" id="ccTop" /></label>
        <label class="cc"><span id="ccBotLabel"></span><input type="color" id="ccBot" /></label>
      </div>
    </div>

    <div class="field">
      <span id="setLinksLabel"></span>
      <div id="linkEditor" class="link-editor"></div>
      <form id="linkAddForm" class="link-add">
        <input id="linkName" type="text" placeholder="Name" autocomplete="off" />
        <input id="linkUrl" type="text" placeholder="https://" autocomplete="off" />
        <button type="submit" class="glass glass-round">+</button>
      </form>
    </div>

    <div class="field toggles" id="toggles"></div>

    <div class="settings-foot">
      <span class="brand">Hina · <span id="privacyNote"></span></span>
    </div>
  </aside>

  <!-- First-run onboarding -->
  <div class="onboard" id="onboard" hidden>
    <div class="onboard-card glass">
      <img class="onboard-logo" src="icons/icon128.png" alt="Hina" width="72" height="72" />
      <h1 id="obTitle"></h1>
      <p id="obSub"></p>
      <form id="obForm" class="onboard-form">
        <input id="obName" type="text" autocomplete="off" spellcheck="false" />
        <button type="submit" class="btn primary" id="obGo"></button>
      </form>
      <button class="link-btn" id="obSkip"></button>
    </div>
  </div>

  <div class="scrim" id="scrim" hidden></div>

  <script src="i18n.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
